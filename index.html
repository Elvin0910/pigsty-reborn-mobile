<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f0dc"><link rel="icon" href="data:,">
<title>重生之在猪圈 · 手机试玩</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#354737;background:#f7f0dc}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.6}#game{position:fixed;inset:0;background:#8da76c}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#welcome{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#fff8e8,#e4eaca);z-index:5}.card{max-width:500px;text-align:center}small{letter-spacing:.2em;color:#708064;font-size:11px}h1{font-size:clamp(30px,7vw,49px);line-height:1.2;margin:12px 0 18px}p{line-height:1.8;font-size:15px;color:#60715b}.pigs{display:flex;justify-content:center;gap:10px;margin:20px}.pigs img{width:clamp(100px,24vw,160px);border-radius:32px;border:3px solid #fff8e8}#start{padding:15px 38px;border:0;background:#43684e;color:#fff9e8;border-radius:30px;font-weight:700;font-size:18px;min-height:52px}progress{display:none;width:100%;accent-color:#43684e;height:9px;margin:20px 0}#loadInfo{min-height:24px;font-size:13px}#hud{display:none;position:fixed;inset:0;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}.top{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;align-items:start;gap:8px;justify-content:space-between}.paper{background:#fff8e8ed;border:1px solid #fcf9e8;border-radius:16px;box-shadow:0 3px 14px #243c2816;padding:10px 14px}.identity{font-size:14px;font-weight:700;white-space:nowrap}.needs{font-size:10px;color:#65705d;font-weight:400;margin-top:4px}#task{font-size:12px;max-width:360px}.tools{display:flex;gap:6px;pointer-events:auto}.tools button{border:0;background:#fff8e8eb;border-radius:13px;min-height:44px;min-width:44px;padding:8px}.bag{position:absolute;top:88px;left:max(12px,env(safe-area-inset-left));font-size:11px;padding:6px 11px}#toast{position:absolute;left:50%;top:29%;transform:translateX(-50%);max-width:75%;font-size:12px;text-align:center;display:none}#near{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);text-align:center;font-size:11px;color:#fffdf3;text-shadow:0 1px 3px #263d25;max-width:40%}.stick{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:max(26px,env(safe-area-inset-left));width:128px;height:128px;border-radius:50%;border:2px solid #fff9df9c;background:#fff9df40;pointer-events:auto;touch-action:none}.stick:before{content:"移动";position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:10px;color:white}.knob{position:absolute;left:39px;top:39px;width:46px;height:46px;border-radius:50%;background:#fff8e8dd;box-shadow:0 2px 8px #183b2133}.actions{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,62px);gap:9px;pointer-events:auto}.actions button{width:62px;height:52px;border:1px solid #fff9e5;border-radius:19px;background:#fff8e8ed;font-size:13px;font-weight:600;touch-action:none}.actions button[data-action=interact]{background:#456d50;color:#fff8e8}.extra{position:absolute;left:174px;bottom:35px;display:flex;gap:6px;pointer-events:auto}.extra button{min-width:44px;min-height:44px;border:1px solid #fff8e8aa;background:#fff8e8c9;border-radius:12px;padding:8px;font-size:11px}.pressed,button:active{filter:brightness(.85)}#pause{position:absolute;inset:0;background:#25342566;display:none;place-items:center;pointer-events:auto}.pausecard{max-width:430px;margin:20px;text-align:center}#resume{border:0;border-radius:20px;background:#43684e;color:#fff9e8;padding:12px 26px;min-height:46px}.rotatehint{display:none}a{color:#46694c}.footer{font-size:11px;color:#7a8770;margin-top:16px}
@media(max-height:450px){#welcome{padding:12px}.card{max-width:650px}.card small{font-size:9px}.card h1{font-size:28px;margin:4px 0}.pigs{margin:8px}.pigs img{width:82px;border-radius:18px}.card p{font-size:12px;line-height:1.5;margin:8px}.card #start{padding:10px 26px;min-height:44px;font-size:16px}.card #loadInfo{font-size:10px;min-height:16px}.card .footer{font-size:9px;margin-top:8px}.card progress{margin:8px 0}.top{top:7px}.paper{padding:7px 10px}#task{max-width:320px;font-size:11px}.bag{top:65px}.stick{width:112px;height:112px;bottom:20px}.knob{left:31px;top:31px}.actions button{height:46px}.actions{gap:6px;bottom:16px}.extra{left:151px;bottom:25px}.identity{font-size:12px}}
@media(orientation:portrait){.rotatehint{display:block;position:absolute;top:140px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#fffbe9;text-shadow:0 1px 3px #233b26}.top{flex-wrap:wrap}.identity{flex:1}#task{order:3;width:100%;max-width:none}.bag{top:111px}.stick{left:18px;width:116px;height:116px}.knob{left:33px;top:33px}.extra{left:18px;bottom:165px}.actions{right:14px}.pigs img{width:130px}#near{bottom:155px;max-width:85%;width:85%}}
</style></head><body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="小猪家园三维游戏"></canvas></main>
<section id="welcome"><div class="card"><small>A LITTLE HOME, TOGETHER</small><h1>重生之在猪圈</h1><div class="pigs"><img src="p1.png" alt="两头乌小猪乌米"><img src="p2.png" alt="花斑小猪花卷"></div><p>控制乌米，和花卷一起探索小院、收集材料，<br>把破旧猪圈修成温暖的新家。</p><button id="start">进入小院</button><progress id="progress" max="1" value="0"></progress><div id="loadInfo">手机横屏体验更好 · 左侧摇杆，右侧动作</div><div class="footer">单人试玩 v0.3.1 · 首次加载请稍候 · 进度仅保存在当前浏览器<br><a href="credits.html" target="_blank" rel="noopener">素材与制作署名</a></div></div></section>
<div id="hud"><div class="top"><div class="paper identity">乌米 & 花卷 <div id="needs" class="needs"></div></div><div id="task" class="paper"></div><div class="tools"><button data-action="build" title="修复家园">建造</button><button data-action="decorate" title="放置床、花盆、围栏">装饰</button><button data-action="save" aria-label="保存进度">存档</button><button data-action="pause" aria-label="暂停游戏">Ⅱ</button></div></div><div class="paper bag" id="bag">共享背包</div><div class="rotatehint">把手机横过来，能看到更宽的小院</div><div id="toast" class="paper" role="status"></div><div id="joystick" class="stick" role="group" aria-label="拖动摇杆移动"><div class="knob"></div></div><div class="extra"><button data-action="left" aria-label="视角向左">↶</button><button data-action="right" aria-label="视角向右">↷</button><button data-action="run" aria-pressed="false">奔跑</button><button data-action="rotate">转家具</button></div><div class="actions"><button data-action="jump">跳跃</button><button data-action="interact">互动</button><button data-action="dig">拱地</button><button data-action="oink">猪叫</button></div><div id="near"></div><div id="pause"><div class="paper pausecard"><h2>休息一下</h2><p>摇杆移动，靠近材料按「互动」收集。<br>一起抬来木梁，再靠近蓝色区域按「建造」。<br>花卷会自动帮忙；修好后就能装饰。<br>键盘也可用 WASD、空格、E、F、Q、R。</p><button id="resume">继续探索</button></div></div></div>
<script>
let game=null,stickPointer=null;const el=id=>document.getElementById(id);function send(method,value){if(game)game.SendMessage('PigstyMobile',method,value)}
window.pigstyUpdate=s=>{el('needs').textContent=`饱食 ${s.hunger} · 饮水 ${s.water} · 伙伴自动协助`;el('bag').textContent=`木材 ${s.wood}  ·  石头 ${s.stone}  ·  稻草 ${s.straw}  ·  食物 ${s.food}`;el('task').textContent=s.task;el('near').textContent=s.prompt.replace('两人一起','和花卷一起');el('toast').textContent=s.message;el('toast').style.display=s.message?'block':'none';el('pause').style.display=s.paused?'grid':'none'};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();send('Act',b.dataset.action);if(b.dataset.action==='run'){let on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.classList.toggle('pressed',on)}}));
const stick=el('joystick'),knob=stick.querySelector('.knob');function stickMove(e){if(e.pointerId!==stickPointer)return;const r=stick.getBoundingClientRect(),limit=r.width*.34;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;let len=Math.hypot(x,y);if(len>limit){x*=limit/len;y*=limit/len}knob.style.transform=`translate(${x}px,${y}px)`;send('Move',`${(x/limit).toFixed(3)},${(-y/limit).toFixed(3)}`)}function clearStick(){stickPointer=null;knob.style.transform='';send('Move','0,0')}
stick.addEventListener('pointerdown',e=>{if(stickPointer!==null)return;stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',stickMove);stick.addEventListener('pointerup',clearStick);stick.addEventListener('pointercancel',clearStick);stick.addEventListener('lostpointercapture',clearStick);
function resetControls(){clearStick();send('Act','clear');const run=document.querySelector('[data-action="run"]');run.setAttribute('aria-pressed','false');run.classList.remove('pressed')}
el('resume').addEventListener('pointerdown',e=>{e.preventDefault();resetControls();send('Act','resume')});
document.addEventListener('visibilitychange',()=>{resetControls();send('Act',document.hidden?'suspend':'foreground')});
window.addEventListener('blur',resetControls);
window.addEventListener('pageshow',()=>{if(!document.hidden)send('Act','foreground')});
el('start').onclick=async()=>{el('start').disabled=true;el('progress').style.display='block';el('loadInfo').textContent='正在打开小院…';try{const manifest=await fetch('build-manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('构建尚未上传');return r.json()});const script=document.createElement('script');script.src=manifest.loader;document.body.appendChild(script);await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(Error('加载器下载失败'))});game=await createUnityInstance(el('unity-canvas'),{dataUrl:manifest.data,frameworkUrl:manifest.framework,codeUrl:manifest.wasm,streamingAssetsUrl:'StreamingAssets',companyName:'Pigsty Studio',productName:'Pigsty Mobile Trial',productVersion:'0.3.1',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),matchWebGLToCanvasSize:true},p=>{el('progress').value=p;el('loadInfo').textContent=`正在准备小院 ${Math.round(p*100)}%`});window.unityInstance=game;el('welcome').style.display='none';el('hud').style.display='block';el('unity-canvas').focus();send('Act','resume')}catch(e){el('loadInfo').textContent='打开失败：'+e.message+'。请用 Safari 或 Chrome 重试。';el('start').disabled=false;el('start').textContent='重新进入'}};
</script></body></html>
